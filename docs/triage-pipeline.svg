<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" width="1000" height="830" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .jev { fill: #eef4ff; stroke: #4f7cff; stroke-width: 1.5; }
    .slow { fill: #fff6e5; stroke: #d4a72c; stroke-width: 1.5; }
    .llm { fill: #f5efff; stroke: #8250df; stroke-width: 1.5; }
    .out { fill: #eafbef; stroke: #2da44e; stroke-width: 1.5; }
    .prof { fill: #fbfbfc; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .sub { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .stat { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .jevstat { fill: #eef4ff; stroke: #4f7cff; }
    .title { fill: #1f2328; font-size: 22px; font-weight: 700; }
    .h { fill: #1f2328; font-size: 14.5px; font-weight: 600; }
    .t { fill: #59636e; font-size: 12.5px; }
    .big { fill: #1f2328; font-size: 20px; font-weight: 700; }
    .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; }
    .tag-jev { fill: #4f7cff; }
    .tag-llm { fill: #8250df; }
    .tag-fit { fill: #4f7cff; }
    .tag-app { fill: #2da44e; }
    .good { fill: #1a7f37; font-size: 13px; font-weight: 600; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .feed { stroke: #2da44e; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
    .head { fill: #8c959f; }
    .headg { fill: #2da44e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box, .stat { fill: #161b22; stroke: #30363d; }
      .jevstat { fill: #121d36; stroke: #6e8fff; }
      .jev { fill: #121d36; stroke: #6e8fff; }
      .slow { fill: #2a2110; stroke: #bb8009; }
      .llm { fill: #1f1636; stroke: #a371f7; }
      .out { fill: #0f2a19; stroke: #3fb950; }
      .prof { fill: #0f141b; stroke: #6e7681; }
      .sub { fill: #161b22; stroke: #30363d; }
      .title, .h, .big { fill: #e6edf3; }
      .t { fill: #9198a1; }
      .tag-jev, .tag-fit { fill: #6e8fff; }
      .tag-llm { fill: #a371f7; }
      .tag-app, .good { fill: #3fb950; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .feed { stroke: #3fb950; }
      .headg { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="headg"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="830"/>
  <text class="title" x="28" y="42">How the job finder works</text>
  <text class="t" x="28" y="64">Cheap, fast decisions first. The slow crawl and the expensive LLM are spent only on likely fits.</text>

  <!-- ===== pipeline (left) ===== -->
  <rect class="box" x="28" y="88" width="460" height="58" rx="10"/>
  <text class="h" x="46" y="112">1 · Search onlinejobs.ph</text>
  <text class="t" x="46" y="131">your keyword (default "python") · how many newest postings you choose (5–90)</text>

  <path class="arrow" d="M258,146 V166" marker-end="url(#a)"/>
  <rect class="jev" x="28" y="168" width="460" height="74" rx="10"/>
  <text class="tag tag-jev" x="46" y="188">JEV · ONE CALL</text>
  <text class="h" x="46" y="207">2 · Screen every posting at once</text>
  <text class="t" x="46" y="226">clear mismatches (&lt; 20% fit) are dropped, never fetched or read</text>

  <path class="arrow" d="M258,242 V262" marker-end="url(#a)"/>
  <rect class="slow" x="28" y="264" width="460" height="58" rx="10"/>
  <text class="h" x="46" y="288">3 · Read the full postings (likely fits only)</text>
  <text class="t" x="46" y="307">5 s each, per the site's robots.txt: the slowest step</text>

  <path class="arrow" d="M258,322 V342" marker-end="url(#a)"/>
  <rect class="jev" x="28" y="344" width="460" height="74" rx="10"/>
  <text class="tag tag-jev" x="46" y="364">JEV · MILLISECONDS PER JOB</text>
  <text class="h" x="46" y="383">4 · Score each job against your profile</text>
  <text class="t" x="46" y="402">fit 0–4 · appeal 0–4 · scam risk · match = average of fit and appeal</text>

  <path class="arrow" d="M258,418 V438" marker-end="url(#a)"/>
  <rect class="llm" x="28" y="440" width="460" height="74" rx="10"/>
  <text class="tag tag-llm" x="46" y="460">LLM · TOP JOBS ONLY</text>
  <text class="h" x="46" y="479">5 · Write a quick brief for each top job</text>
  <text class="t" x="46" y="498">what the role is · ✓ why you fit · △ what's missing</text>

  <path class="arrow" d="M258,514 V534" marker-end="url(#a)"/>
  <rect class="out" x="28" y="536" width="460" height="92" rx="10"/>
  <text class="h" x="46" y="560">6 · Your shortlist (web app)</text>
  <text class="t" x="46" y="580">best match first · pay, hours, posted time, link to the posting</text>
  <text class="t" x="46" y="598">your filters: min match · min pay /hr /mo /yr · job type · scams</text>
  <text class="t" x="46" y="616">buttons: Mark applied · Not interested</text>

  <!-- ===== profile (right) ===== -->
  <rect class="prof" x="560" y="168" width="412" height="346" rx="12"/>
  <text class="h" x="580" y="194">Your profile</text>
  <text class="t" x="580" y="212">editable on the Profile page</text>

  <rect class="sub" x="580" y="226" width="372" height="78" rx="9"/>
  <text class="tag tag-fit" x="596" y="246">DRIVES FIT</text>
  <text class="h" x="596" y="266">Resume</text>
  <text class="t" x="596" y="285">upload PDF or DOCX, then edit the text</text>

  <rect class="sub" x="580" y="314" width="372" height="78" rx="9"/>
  <text class="tag tag-app" x="596" y="334">DRIVES APPEAL</text>
  <text class="h" x="596" y="354">What you want</text>
  <text class="t" x="596" y="373">roles · pay floor · fully remote · not interested in</text>

  <rect class="sub" x="580" y="402" width="372" height="92" rx="9"/>
  <text class="tag tag-app" x="596" y="422">DRIVES APPEAL · LEARNED</text>
  <text class="h" x="596" y="442">Your choices</text>
  <text class="t" x="596" y="461">jobs you applied to and skipped, their</text>
  <text class="t" x="596" y="479">common skills and typical pay</text>

  <!-- profile feeds Jev and the LLM -->
  <path class="arrow" d="M560,205 H492" marker-end="url(#a)"/>
  <path class="arrow" d="M560,381 H492" marker-end="url(#a)"/>
  <path class="arrow" d="M560,477 H492" marker-end="url(#a)"/>
  <text class="t" x="500" y="198" font-size="11">ranks</text>
  <text class="t" x="500" y="374" font-size="11">scores</text>
  <text class="t" x="500" y="470" font-size="11">briefs</text>

  <!-- feedback loop: marks teach the profile -->
  <path class="feed" d="M488,610 H766 V498" marker-end="url(#g)"/>
  <text class="good" x="584" y="602">your marks teach the profile</text>

  <!-- ===== results ===== -->
  <text class="h" x="28" y="672">Without Jev vs. with Jev, on the same 30 real Python postings</text>
  <text class="t" x="28" y="692">Without Jev, every posting is read and the LLM has to score and summarize all of them. Last box: the scoring step alone.</text>
  <rect class="stat" x="28" y="708" width="226" height="106" rx="10"/>
  <text class="t" x="44" y="732">Time per search</text>
  <text class="big" x="44" y="764">20 min → 3.5 min</text>
  <text class="t" x="44" y="784" font-size="11">without Jev → with Jev</text>
  <text class="good" x="44" y="805">5.6× faster</text>
  <rect class="stat" x="270" y="708" width="226" height="106" rx="10"/>
  <text class="t" x="286" y="732">LLM tokens per search</text>
  <text class="big" x="286" y="764">103k → 12k</text>
  <text class="t" x="286" y="784" font-size="11">without Jev → with Jev</text>
  <text class="good" x="286" y="805">88% fewer</text>
  <rect class="stat" x="512" y="708" width="226" height="106" rx="10"/>
  <text class="t" x="528" y="732">LLM calls per search</text>
  <text class="big" x="528" y="764">30 → 4</text>
  <text class="t" x="528" y="784" font-size="11">without Jev → with Jev</text>
  <text class="good" x="528" y="805">only the top jobs</text>
  <rect class="stat jevstat" x="754" y="708" width="226" height="106" rx="10"/>
  <text class="t" x="770" y="732">Scoring one job</text>
  <text class="big" x="770" y="764">34 s → 0.2 s</text>
  <text class="t" x="770" y="784" font-size="11">LLM → Jev</text>
  <text class="good" x="770" y="805">≈150× faster</text>
</svg>
